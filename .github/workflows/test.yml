name: test

# The suite existed and nothing ran it. This repository shipped 58 passing tests
# with no workflow to run them, so a push could break any of them and no one
# would know: the tests guarded a developer's machine, not the code.
#
# `npm test` is `vitest run` (vitest.config.ts includes server/**/*.test.ts).
# The suite is node-environment and mocks its own store, so it needs no service
# and no secrets — only a checkout, Node, and the dependency tree. `better-sqlite3`
# is a native module: this runner can build it, the Forge cycle sandbox cannot,
# which is why this job lives here rather than in the cycle.
#
# The second job is the type check. `npm run check` (`tsc --noEmit`) existed in
# package.json from the start and NOTHING ran it, so a type error shipped as long
# as no test happened to touch it. Turning it on over the whole tree found five
# errors on `main` — four from a tsconfig with no `target` (so tsc compiled as
# ES5 while the app runs on Node 22) and one where a test fixture declared
# `category: string` for a field the schema types as a union. It also found that
# the tsconfig excluded `**/*.test.ts`, so the 10 test files — the files most
# likely to drift from the code they test — were the one part of the tree a type
# check would never have seen. Both are fixed, and this job is the guard.
#
# The third job is lint. `npm run lint` (`eslint .`) existed in package.json and
# nothing ran it either, so the same trap was open one rung down: 140 files lint
# clean today and any push could break a rule in silence. It runs with
# `--max-warnings=0`, because two of the configured rules are warnings and the
# unused-variable one is the rule that catches dead code.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # was @v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # `--legacy-peer-deps` is required, and its absence is itself a finding: the
        # lockfile (lockfileVersion 3) holds a peer conflict no strict install can
        # resolve — `@builder.io/vite-plugin-jsx-loc@0.1.1` declares `vite: ^4 || ^5`
        # while the project is on `vite: ^7.1.7`. The tree was only ever installed
        # with legacy resolution, and nothing in the repo recorded that, so a plain
        # `npm ci` fails ERESOLVE on a clean machine. That is not a CI quirk to work
        # around silently: it is why this step is the first thing the workflow pins.
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run the test suite
        # A suite that runs zero tests is a green light that checked nothing, so
        # refuse to report success unless vitest actually collected some. Two
        # details, both learned the hard way on this workflow's first run:
        #   * `NO_COLOR` and the `sed` below strip ANSI, because vitest colours the
        #     summary and the escapes sit BETWEEN "Tests" and the count — a plain
        #     grep for `Tests +[0-9]+ passed` misses a fully green run (it did).
        #   * `set +e` is deliberate: the runner's shell is `bash -eo pipefail`,
        #     which would abort at the pipeline and skip the diagnosis.
        env:
          NO_COLOR: "1"
        run: |
          set +e
          npm test 2>&1 | tee vitest.log
          status=${PIPESTATUS[0]}
          set -e
          sed -e 's/\x1b\[[0-9;]*m//g' vitest.log > vitest-clean.log
          if ! grep -qE "Tests +[0-9]+ passed" vitest-clean.log; then
            echo "::error::vitest collected no passing tests — this job proved nothing"
            exit 1
          fi
          grep -E "Tests +[0-9]+ passed" vitest-clean.log
          exit "$status"

  typecheck:
    name: type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # was @v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # `--ignore-scripts` is correct here and is the point of a separate job:
        # a type check reads `.d.ts` files and never loads a native binding, so
        # `better-sqlite3` does not have to be compiled to prove the types. The
        # same peer conflict as the test job applies, hence `--legacy-peer-deps`.
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Type check the whole tree, tests included
        # `tsc` exits 0 when it checked nothing — a broken `include` glob is a
        # green light that proved nothing, the same trap the test job guards
        # against. So the file count is asserted before the exit code is trusted.
        run: |
          set +e
          npx tsc --noEmit --listFiles > tsc.log 2>&1
          status=$?
          set -e
          grep -E 'error TS' tsc.log || true
          checked=$(grep -c "^${GITHUB_WORKSPACE}/" tsc.log || true)
          echo "files type-checked: $checked"
          if [ "$checked" -lt 100 ]; then
            echo "::error::tsc checked $checked files — the check proved nothing"
            exit 1
          fi
          exit "$status"

  # The third gate, and the one rung down from the type check. `npm run lint`
  # (`eslint .`) existed in package.json and, like `npm run check` before it,
  # nothing ran it: 140 files are linted clean today, so any push is free to
  # break a rule and no one would hear about it.
  #
  # Two details are the whole job:
  #   * `--max-warnings=0`. Two of the rules the config sets are WARNINGS, and
  #     `@typescript-eslint/no-unused-vars` is the one that matters — dead code
  #     is exactly what a warning-level rule catches. Measured on this tree: a
  #     single unused `const` added to a page exits 0 under plain `eslint .` and
  #     1 under `--max-warnings=0`. Without the flag the gate has a hole in it.
  #   * the file count is asserted. ESLint exits 0 when it lints nothing, so an
  #     `ignores` entry or a `files` glob that stopped matching would read as a
  #     green run that inspected nothing — the same trap the test job (no tests
  #     collected) and the type check (no files listed) each guard against.
  # `--ignore-scripts` again: eslint loads no native binding, so better-sqlite3
  # does not have to be compiled to lint the tree.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # was @v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Lint the whole tree, tests included
        env:
          NO_COLOR: "1"
        run: |
          set +e
          npx eslint . --max-warnings=0 --format json > lint.json 2> lint.err
          status=$?
          set -e
          cat lint.err
          node -e '
            const fs = require("fs");
            let results = [];
            try { results = JSON.parse(fs.readFileSync("lint.json", "utf8")); } catch (e) {
              console.log("::error::eslint wrote no parsable report — the gate proved nothing");
              process.exit(1);
            }
            let problems = 0;
            for (const file of results) {
              for (const m of file.messages) {
                problems++;
                const level = m.severity === 2 ? "error" : "warning";
                console.log(`${file.filePath}:${m.line}:${m.column}  ${level}  ${m.message}  (${m.ruleId})`);
              }
            }
            console.log(`files linted: ${results.length}, problems: ${problems}`);
            if (results.length < 100) {
              console.log(`::error::eslint inspected ${results.length} files — the gate proved nothing`);
              process.exit(1);
            }
            process.exit(problems > 0 ? 1 : 0);
          '
          exit "$status"
